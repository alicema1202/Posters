name: Update TMDB Catalog

on:
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run updater
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node updateCatalog.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add catalog/movie/movieCatalog.json
          git add catalog/series/seriesCatalog.json

          git commit -m "Update TMDB catalog" || exit 0

          git push