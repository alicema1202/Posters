name: Update TMDB Catalog

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22


      - name: Install dependencies
        run: npm install


      - name: Run catalog updater
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          MDBLIST_KEY: ${{ secrets.MDBLIST_KEY }}
        run: node updateCatalog.js


      - name: Clear old poster images
        run: |
          rm -rf image/*
          mkdir -p image


      - name: Generate posters
        run: node generatePosters.js

      - name: Generate landscape posters
        run: node generateLandscapePosters.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add catalog/movie/movieCatalog.json
          git add catalog/series/seriesCatalog.json
          git add landscape/catalog/movie/movieCatalog-landscape.json
          git add landscape/catalog/series/seriesCatalog-landscape.json
          git add posters-only/catalog/series/series-posters.json
          git add posters-only/catalog/movie/movies-posters.json
          git add image/

          git commit -m "Update TMDB catalog and posters" || exit 0

          git push