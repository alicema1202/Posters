name: Update TMDB Catalog

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22


      - name: Install dependencies
        run: npm install


      - name: Run catalog updater
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          MDBLIST_KEY: ${{ secrets.MDBLIST_KEY }}
          TVDB_KEY: ${{ secrets.TVDB_KEY }}
        run: node updateCatalog.js


      # Posters go in image/<build>/. Keep only the previous build's folder:
      # apps like Nuvio hold yesterday's catalog until restarted, and it
      # still points there. On the first run after switching to folders,
      # keep the old flat image/*.png files for the same reason.
      - name: Clear old poster images
        run: |
          mkdir -p image
          latest=$(ls image | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          if [ -n "$latest" ]; then
            for f in image/*; do
              [ "$f" = "image/$latest" ] || rm -rf "$f"
            done
          fi


      - name: Generate posters
        run: node generatePosters.js

      - name: Generate landscape posters
        run: node generateLandscapePosters.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add catalog/movie/movieCatalog.json
          git add catalog/series/seriesCatalog.json
          git add landscape/catalog/movie/movieCatalog-landscape.json
          git add landscape/catalog/series/seriesCatalog-landscape.json
          git add posters-only/catalog/series/series-posters.json
          git add posters-only/catalog/movie/movies-posters.json
          git add image/

          git commit -m "Update TMDB catalog and posters" || exit 0

          git push