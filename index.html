<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMDB Poster Fetcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .background {
            width: 500px;
            height: 750px;
            border-radius: 10px;
            display: block;
            object-fit: cover;
        }

        #error {
            color: red;
            margin-top: 20px;
        }
    </style>
    <link rel="stylesheet" href="posterStyle.css">
</head>

<body>
    <div class="poster">
        <img class="background" src="https://image.tmdb.org/t/p/w1280/pWokAXaDOg4Rc5YLE6oW60myIl7.jpg" alt="Movie Poster">
        <div class="overlay"></div>
        <div class="rank">
            1
        </div>

        <img
            class="logo"
            src="https://image.tmdb.org/t/p/w500/qAgFWZZFCtQUx2b7QcCzFE20yyW.png"
        />
    </div>

</body>
</html>
